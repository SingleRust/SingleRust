[package]
name = "single_rust"
version = "0.5.3"
edition = "2021"
license-file = "LICENSE.md"
readme = "README.md"
description = "Single-cell analysis in Rust"
categories = ["science"]
repository = "https://github.com/SingleRust/SingleRust"
homepage = "https://singlerust.com"

[features]
lapack = ["single_algebra/lapack"]
faer = ["single_algebra/faer"]
simba = ["single_algebra/simba", "dep:simba"]

[dependencies]
anndata = "0.6.1"
anndata-hdf5 = "0.5.0"
polars = { version = "0.45.1", features = [
    "lazy",
    "decompress-fast",
    "ndarray",
    "dtype-full",
] }
ndarray = { version = "0.16.1", features = ["rayon"] }
nalgebra-sparse = "0.10.0"
anyhow = "1.0.86"
log = "0.4.22"
anndata-memory = { version = "1.0.6" }
num-traits = "0.2.19"
rand = "0.9.1"
nalgebra = { version = "0.33.2", features = ["serde-serialize", "rayon"] }
single_algebra = { path = "../single-algebra", features = [] }
simba = { version = "0.9.0", optional = true }
single-utilities = "0.8.0"
single-statistics = { path = "../single-statistics" }


[dev-dependencies]
env_logger = "0.11.5"
