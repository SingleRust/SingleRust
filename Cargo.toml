[package]
name = "single_rust"
version = "0.2.2-alpha.0"
edition = "2021"
license-file = "LICENSE.md"
readme = "README.md"
description = "Single-cell analysis in Rust"
categories = ["science"]
repository = "https://github.com/SingleRust/SingleRust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
lapack = ["single_algebra/lapack"]
faer = ["single_algebra/faer"]
simba = ["single_algebra/simba", "dep:simba"]

[dependencies]
anndata = "0.6.1"
anndata-hdf5 = "0.5.0"
polars = { version = "0.45.1", features = [
    "lazy",
    "decompress-fast",
    "ndarray",
    "dtype-full",
] }
ndarray = { version = "0.16.1", features = ["rayon"] }
nalgebra-sparse = "0.10.0"
smallvec = "1.11"
permutation = "0.4"
flate2 = "1.0.28"
itertools = "0.13.0"
indicatif = "0.17.8"
console = "0.15.8"
anyhow = "1.0.86"
rayon = { version = "1.9.0" }
log = "0.4.22"
anndata-memory = "0.1.2-alpha.0"
num-traits = "0.2.19"
statrs = "0.18.0"
ndarray-stats = "0.6.0"
noisy_float = "0.2.0"
rand = "0.8.5"
plotters = "0.3.6"
smartcore = { version = "0.4.0", features = ["ndarray-bindings"] }
nshare = { version = "0.10.0", features = ["ndarray", "nalgebra"] }
nalgebra = { version = "0.33.2", features = ["serde-serialize", "rayon"] }
single_algebra = { version = "0.2.3-alpha.0", features = ["statistics"] }
simba = {version = "0.9.0", optional = true}
#ndarray-linalg = {version = "0.16.0"}

[dev-dependencies]
env_logger = "0.11.5"
