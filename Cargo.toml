[package]
name = "single_rust"
version = "0.5.7"
edition = "2021"
license-file = "LICENSE.md"
readme = "README.md"
description = "Single-cell analysis in Rust"
categories = ["science"]
repository = "https://github.com/SingleRust/SingleRust"
homepage = "https://singlerust.com"

[features]
simba = ["single_algebra/simba", "dep:simba"]
enrichment = ["single-statistics/enrichment"]
db-io = ["dep:reqwest", "dep:tokio", "dep:bytes"]
[dependencies]
anndata = "0.6.1"
anndata-hdf5 = "0.5.0"
polars = { version = "0.45.1", features = [
    "lazy",
    "decompress-fast",
    "ndarray",
    "dtype-full",
    "polars-io",
    "pivot"
] }
ndarray = { version = "0.16.1", features = ["rayon"] }
nalgebra-sparse = "0.10.0"
anyhow = "1.0.86"
log = "0.4.27"
anndata-memory = { version = "1.0.6" }
num-traits = "0.2.19"
rand = "0.9.2"
nalgebra = { version = "0.33.2", features = ["serde-serialize", "rayon"] }
single_algebra = { version = "0.8.7", features = [] }
simba = { version = "0.9.0", optional = true }
single-utilities = { version = "0.8.7" }
single-statistics = { version = "0.8.3" }
reqwest = { version = "0.12.24", features = ["stream", "blocking"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
bytes = { version = "1.10.1", optional = true }



[dev-dependencies]
env_logger = "0.11.8"
